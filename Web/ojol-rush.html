<title>Ojol Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Semi+Condensed:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#1a1410; --ink:#fff6e6; --dim:#e9d9bf; --green:#1fc75a; --green-d:#0f7d37;
  --yellow:#ffd23f; --orange:#ff8a1f; --red:#ff4b3a; --panel:rgba(20,16,14,.72); --card:#fffaf0; --card-ink:#241c16;
  color-scheme:dark;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Barlow Semi Condensed","Arial Narrow",Roboto,system-ui,sans-serif;
}
[hidden]{display:none!important;}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none;}
body{font-family:var(--body);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
#game{position:fixed;inset:0;touch-action:none;overflow:hidden;background:#f6b877;}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
.layer{position:absolute;inset:0;pointer-events:none;}
#pops .pop{position:absolute;left:0;top:0;font-family:var(--display);white-space:nowrap;transform-origin:center;
  text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 6px rgba(0,0,0,.4);will-change:transform,opacity;}
#lines{opacity:0;background:
  repeating-linear-gradient(90deg,transparent 0 22vw,rgba(255,255,255,.0) 22vw),
  linear-gradient(90deg,rgba(255,255,255,.5),transparent 18%,transparent 82%,rgba(255,255,255,.5));
  -webkit-mask:repeating-linear-gradient(0deg,#000 0 3px,transparent 3px 26px);mask:repeating-linear-gradient(0deg,#000 0 3px,transparent 3px 26px);}
#flash{background:radial-gradient(ellipse at center,transparent 35%,rgba(255,40,20,.75));opacity:0;}
#arrow{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;display:none;}
#arrow svg{width:100%;height:100%;filter:drop-shadow(0 3px 0 rgba(0,0,0,.5));}
#arrowDist{position:absolute;left:50%;top:100%;transform:translateX(-50%);font:800 18px var(--body);white-space:nowrap;text-shadow:0 2px 0 #000;}

#hud{position:absolute;inset:0;pointer-events:none;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);}
#topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;padding:8px 14px 10px;
  background:linear-gradient(180deg,rgba(15,12,10,.82),rgba(15,12,10,.55));}
.stat label{display:block;font:700 12px var(--body);letter-spacing:.14em;color:var(--dim);opacity:.85;}
.stat b{font:400 28px/1.05 var(--display);font-variant-numeric:tabular-nums;}
.stat.mid{text-align:center;} .stat.mid b{font-size:34px;}
.stat.right{text-align:right;}
#stars{font-size:22px;letter-spacing:1px;line-height:1.2;color:#4a403a;}
#stars .on{color:var(--yellow);}
#timer.low{color:var(--red);animation:pulse .5s infinite alternate;}
@keyframes pulse{to{transform:scale(1.08);}}
#rush{display:inline-block;margin:8px 14px 0;padding:5px 12px;border-radius:999px;font:800 14px var(--body);letter-spacing:.06em;background:#2e7d4a;}
#card{margin:8px 14px 0;display:flex;border-radius:14px;overflow:hidden;background:var(--card);color:var(--card-ink);box-shadow:0 6px 0 rgba(0,0,0,.25);max-width:560px;}
#card .app{background:var(--green);color:#fff;padding:8px 10px;min-width:84px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;}
#card .app span{font:800 12px var(--body);letter-spacing:.04em;opacity:.95;}
#card .app strong{font:400 17px var(--display);}
#card.pickup .app{background:var(--orange);}
#card .info{padding:8px 12px 8px;flex:1;min-width:0;}
#place{font:800 19px/1.15 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#item{font:600 14px/1.3 var(--body);color:#6b5b4e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#item.pen{color:#c0392b;}
.bar{height:6px;border-radius:3px;background:rgba(0,0,0,.12);margin-top:6px;overflow:hidden;}
.bar i{display:block;height:100%;width:100%;background:var(--green);border-radius:3px;}
#notify{margin:8px 14px 0;max-width:560px;padding:8px 12px;border-radius:12px;background:rgba(18,15,13,.86);}
#notify b{display:block;font:400 14px var(--display);color:#7dff9f;}
#notify span{font:600 15px/1.3 var(--body);white-space:pre-line;}
#combo{position:absolute;left:0;right:0;top:34%;text-align:center;}
#comboTxt{font:400 44px var(--display);color:var(--yellow);text-shadow:0 4px 0 rgba(0,0,0,.55);display:inline-block;}
#combo .bar{width:180px;margin:4px auto 0;background:rgba(0,0,0,.35);}
#combo .bar i{background:var(--yellow);}
#banner{position:absolute;left:16px;right:16px;top:60%;text-align:center;padding:10px 14px;border-radius:12px;
  background:rgba(15,12,10,.72);font:800 20px var(--body);}
#big{position:absolute;left:0;right:0;top:40%;text-align:center;}
#big b{display:block;font:400 64px/1 var(--display);color:var(--yellow);text-shadow:0 5px 0 rgba(0,0,0,.55);}
#big span{display:block;margin-top:8px;font:800 22px var(--body);text-shadow:0 2px 0 #000;}
#helmets{position:absolute;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;}
#helmets svg{width:52px;height:52px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45));}
.hel path.dome{fill:var(--green);} .hel.lost path.dome{fill:#6d6560;} .hel.last path.dome{fill:var(--red);}
.hel .crack{display:none;} .hel.lost .crack{display:block;}
#pauseBtn{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));pointer-events:auto;width:52px;height:52px;border-radius:14px;border:0;
  background:rgba(15,12,10,.6);color:#fff;font:400 20px var(--display);cursor:pointer;}
#brakeBtn{position:absolute;right:14px;bottom:calc(78px + env(safe-area-inset-bottom,0px));pointer-events:auto;width:84px;height:84px;border-radius:50%;
  border:4px solid #2a1a0a;background:#e8352a;color:#fff;font:400 22px var(--display);letter-spacing:.04em;cursor:pointer;box-shadow:0 5px 0 #2a1a0a;touch-action:none;}
#brakeBtn.on{transform:translateY(4px);box-shadow:0 1px 0 #2a1a0a;background:#b8231a;}
#stick{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:3px solid rgba(255,255,255,.55);left:0;top:0;}
#knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.6);}
#crack{position:absolute;left:50%;top:44%;width:180px;height:180px;margin:-90px 0 0 -90px;}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(26,18,12,.25),rgba(26,18,12,.78) 60%);text-align:center;}
#title{justify-content:flex-start;padding-top:calc(40px + env(safe-area-inset-top,0px));
  background:linear-gradient(180deg,rgba(20,12,6,.1) 0%,rgba(20,12,6,.0) 35%,rgba(20,12,6,.55) 62%,rgba(20,12,6,.88) 100%),url(assets/keyart.webp) center/cover no-repeat,#b5663a;}
#title .spacer{flex:1;}
.logo{font:400 clamp(56px,17vw,104px)/.92 var(--display);letter-spacing:.01em;text-shadow:0 6px 0 rgba(0,0,0,.45);}
.logo .o{color:var(--green);} .logo .r{color:var(--yellow);}
.tag{font:700 20px/1.3 var(--body);max-width:28ch;}
.plate{display:inline-block;font:700 12px var(--body);letter-spacing:.16em;padding:4px 10px;border:2px solid var(--ink);border-radius:6px;opacity:.85;}
.btn{pointer-events:auto;border:0;border-radius:18px;font:400 26px var(--display);color:#fff;padding:16px 36px;min-width:250px;cursor:pointer;
  background:var(--green);box-shadow:0 7px 0 var(--green-d);transition:transform .08s;}
.btn:active{transform:translateY(4px);box-shadow:0 3px 0 var(--green-d);}
.btn:focus-visible{outline:3px solid var(--yellow);outline-offset:3px;}
.btn.alt{background:#3a3129;box-shadow:0 6px 0 #1c1612;font:800 17px var(--body);letter-spacing:.04em;padding:12px 20px;}
.btn.warn{background:#d9532b;box-shadow:0 7px 0 #8d2f14;font-size:20px;}
.hint{font:600 15px/1.4 var(--body);opacity:.85;max-width:34ch;}
.best{font:800 17px var(--body);}
.over-title{font:400 clamp(40px,11vw,64px)/1 var(--display);color:var(--yellow);text-shadow:0 5px 0 rgba(0,0,0,.5);}
.reason{font:800 19px var(--body);color:#ff8f7d;}
.big-score{font:400 clamp(52px,16vw,88px)/1 var(--display);font-variant-numeric:tabular-nums;}
.stats{display:grid;grid-template-columns:auto auto;gap:4px 18px;font:700 17px var(--body);text-align:left;}
.stats dt{opacity:.75;} .stats dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;}
@media (prefers-reduced-motion: reduce){#timer.low{animation:none;} .btn{transition:none;}}
</style>

<div id="game">
  <canvas id="c"></canvas>

  <div id="arrow"><svg viewBox="0 0 40 40"><path id="arrowPath" d="M20 3 L37 34 L20 25 L3 34Z" fill="#ff8a1f" stroke="#2a1a0a" stroke-width="2" stroke-linejoin="round"/></svg><span id="arrowDist"></span></div>
  <div id="hud" hidden>
    <div id="topbar">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
"use strict";
/* ====================================================================================
   OJOL RUSH — browser port of the Unity prototype (same rules, traffic AI and tuning).
   Game logic lives in 2D map coordinates (x east, y north). Three.js: X = x, Z = -y.
   ==================================================================================== */
const T = THREE;
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------- config
const CFG = {
  maxSpeed:17, accel:7, brake:14, holdFactor:0.45, turnLow:280, turnHigh:170, sharpTurn:100,
  grip:9, puddleGrip:1.3, puddleSlide:0.8, rainGrip:0.55, sidewalkF:0.75, gangF:0.95, floodF:0.4, radius:0.55, jump:0.35,
  helmets:3, heavy:7, invuln:1.6, nearDist:1.1, nearMinSpeed:8, nearPts:50, comboWindow:2, maxMult:10,
  deliveryBase:500, speedBonus:15, tips:[0,0,0,50,120,300], ratingOver:3.0, ratingHistory:10, ratingSeed:3,
  orderBase:12, orderRef:8.5, markerR:4, nextOrder:1.5, foodChance:0.6,
  pickMin:60, pickMax:170, dropMin:110, dropMax:260, raziaStop:2.5, raziaPenalty:8, hitStop:0.06,
};
const LEVELS = [
  {title:"Santai", at:0, traffic:28, speedMul:1, w:{car:.35,angkot:.15,bajaj:.1,bus:.05,bike:.35}, pax:5, timer:1.55, rain:0, always:false, flood:0, razia:0, cat:10, honk:.2, green:9},
  {title:"Mulai Padat", at:2, traffic:40, speedMul:1, w:{car:.3,angkot:.22,bajaj:.1,bus:.05,bike:.35}, pax:14, timer:1.3, rain:0, always:false, flood:0, razia:0, cat:8, honk:.35, green:9},
  {title:"Hujan Lokal", at:4, traffic:50, speedMul:1, w:{car:.3,angkot:.2,bajaj:.1,bus:.05,bike:.35}, pax:14, timer:1.12, rain:.45, always:false, flood:0, razia:1, cat:7, honk:.5, green:9},
  {title:"Jam Pulang Kantor", at:6, traffic:64, speedMul:1, w:{car:.28,angkot:.2,bajaj:.1,bus:.12,bike:.3}, pax:16, timer:1.0, rain:.5, always:false, flood:2, razia:2, cat:6, honk:.8, green:7},
  {title:"MACET TOTAL", at:9, traffic:95, speedMul:.75, w:{car:.3,angkot:.2,bajaj:.1,bus:.14,bike:.26}, pax:22, timer:.75, rain:0, always:true, flood:4, razia:3, cat:4, honk:1.6, green:5},
];

// ---------------------------------------------------------------- math
const R = (a,b) => a + Math.random()*(b-a);
const RI = n => (Math.random()*n)|0;
const pick = a => a[RI(a.length)];
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp = (a,b,t) => a+(b-a)*t;
const mt = (c,t,m) => Math.abs(t-c)<=m ? t : c+Math.sign(t-c)*m;
const expl = (k,dt) => 1-Math.exp(-k*dt);
const DEG = Math.PI/180;
const dAng = (a,b) => ((b-a)%360+540)%360-180;
const headingOf = (x,y) => Math.atan2(x,y)/DEG;
const fmt = n => Math.round(n).toLocaleString('id-ID');
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

// ---------------------------------------------------------------- city map
const PITCH=60, LANE=3.5, ROAD_HALF=7, CORR=10, SW_H=0.12, GANG_HALF=1.75, STOP_BACK=3.5;
const NX=5, NZ=7;
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
const leftOf=d=>(d+1)&3, rightOf=d=>(d+3)&3, opp=d=>(d+2)&3, isH=d=>(d&1)===0;
const MINX=-CORR, MAXX=(NX-1)*PITCH+CORR, MINY=-CORR, MAXY=(NZ-1)*PITCH+CORR;
const GANGS=[
  {x0:1.5*PITCH-GANG_HALF, y0:PITCH, x1:1.5*PITCH+GANG_HALF, y1:3*PITCH},
  {x0:2*PITCH, y0:4.5*PITCH-GANG_HALF, x1:4*PITCH, y1:4.5*PITCH+GANG_HALF},
];
const SB=0, SROAD=1, SSIDE=2, SGANG=3;
function axisDist(v,n){ const k=clamp(Math.round(v/PITCH),0,n-1); return Math.abs(v-k*PITCH); }
function surfaceAt(x,y){
  if(x<MINX||x>MAXX||y<MINY||y>MAXY) return SB;
  const d=Math.min(axisDist(x,NX),axisDist(y,NZ));
  if(d<=ROAD_HALF) return SROAD;
  if(d<=CORR) return SSIDE;
  for(const g of GANGS) if(x>=g.x0&&x<g.x1&&y>=g.y0&&y<g.y1) return SGANG;
  return SB;
}
const drivable=(x,y,r)=>surfaceAt(x,y)&&surfaceAt(x+r,y)&&surfaceAt(x-r,y)&&surfaceAt(x,y+r)&&surfaceAt(x,y-r);
const inJunction=(x,y)=>axisDist(x,NX)<=CORR&&axisDist(y,NZ)<=CORR;
const hasNode=(i,j)=>i>=0&&j>=0&&i<NX&&j<NZ;
const hasEdge=(i,j,d)=>hasNode(i,j)&&hasNode(i+DIRS[d][0],j+DIRS[d][1]);
function edgeLane(i,j,d,lane){
  const f=DIRS[d], k=(lane+0.5)*LANE, ox=-f[1]*k, oy=f[0]*k, nx=i*PITCH, ny=j*PITCH;
  return {ax:nx+f[0]*CORR+ox, ay:ny+f[1]*CORR+oy, bx:nx+f[0]*(PITCH-CORR)+ox, by:ny+f[1]*(PITCH-CORR)+oy};
}
const H_STREETS=["Jl. Kenanga","Jl. Pasar Lama","Jl. Melati","Jl. Kebon Kacang","Jl. Cempaka","Jl. Rawa Belong","Jl. Mangga Dua-an"];
const V_STREETS=["Jl. Pahlawan","Jl. Kramat","Jl. Salemba Kecil","Jl. Tanah Abang Ria","Jl. Cikini Raya-ish"];
function streetName(x,y){
  if(axisDist(y,NZ)<=axisDist(x,NX)) return H_STREETS[clamp(Math.round(y/PITCH),0,NZ-1)];
  return V_STREETS[clamp(Math.round(x/PITCH),0,NX-1)];
}
const RESTOS=["Warung Bu Tini","Bakso Mas Joko","Martabak Bang Udin","Nasi Padang Sederhana Banget","Kopi Senja Abadi","Sate Pak Kumis","Mie Ayam Gerobak Biru","Pecel Lele Cak Mat","Seblak Teh Ncep","Nasi Uduk Bu Yayah","Soto Betawi H. Ma'ruf-an","Gorengan Mang Asep"];
const HOMES=["Kos Melati No. 7","Kantor Lt. 3 (titip satpam)","Rumah Pagar Hijau","Apartemen Tower B","Kontrakan Bu RT","Pos Ronda RW 05","Ruko Cat Kuning","Bengkel Jaya Motor","Kos Putri Anggrek","Rumah Dinas RT 03","Salon Cantik Sekali","Rumah No. 13B","Warnet Gaming Pro","Toko Bangunan Sinar"];
const blockRect=(bi,bj)=>({x0:bi*PITCH+CORR,y0:bj*PITCH+CORR,x1:(bi+1)*PITCH-CORR,y1:(bj+1)*PITCH-CORR});
const SPOTS=[];
(function buildSpots(){
  let r=0,h=0;
  for(let bi=0;bi<NX-1;bi++) for(let bj=0;bj<NZ-1;bj++){
    const b=blockRect(bi,bj), cx=(b.x0+b.x1)/2, cy=(b.y0+b.y1)/2;
    for(let side=0;side<4;side++){
      const u=R(-10,10);
      const p = side===0?[cx+u,b.y0-1.5]:side===1?[b.x1+1.5,cy+u]:side===2?[cx+u,b.y1+1.5]:[b.x0-1.5,cy+u];
      let near=false;
      for(const g of GANGS){ if(Math.abs(p[0]-clamp(p[0],g.x0,g.x1))<3&&Math.abs(p[1]-clamp(p[1],g.y0,g.y1))<3) near=true; }
      if(near) continue;
      const resto=Math.random()<0.35;
      SPOTS.push({x:p[0],y:p[1],resto,name:resto?RESTOS[r++%RESTOS.length]:HOMES[h++%HOMES.length]});
    }
  }
})();

// ---------------------------------------------------------------- traffic lights
const lights={
  off:Array.from({length:NX*NZ},()=>Math.random()*30), green:9,
  state(i,j,horiz,t){
    const cyc=2*(this.green+4), half=this.green+4;
    let x=((t+this.off[j*NX+i])%cyc+cyc)%cyc;
    if(!horiz) x=(x+half)%cyc;
    return x<this.green?0:(x<this.green+2?1:2);
  }
};

// ---------------------------------------------------------------- three.js setup
const canvas=$('c');
const lowEnd=/Android|iPhone|iPad/i.test(navigator.userAgent);
const renderer=new T.WebGLRenderer({canvas,antialias:!lowEnd,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, lowEnd?1.5:2));
const scene=new T.Scene();
const SKY=new T.Color(0xf6b877), SKY_RAIN=new T.Color(0x7d8794);
scene.background=SKY.clone();
scene.fog=new T.Fog(0xf2b27a,75,175);
const camera=new T.PerspectiveCamera(55,1,1,300);
const hemi=new T.HemisphereLight(0xffe2c0,0x5a4638,0.78); scene.add(hemi);
const sun=new T.DirectionalLight(0xffcf94,0.95); sun.position.set(-60,80,40); scene.add(sun);
const SUN_C=new T.Color(0xffcf94), RAIN_C=new T.Color(0x9aa6b5);

// Cel shading: three hard light bands.

function lot3d(x0,x1,y0,y1,face,type,h){

// ---------------------------------------------------------------- traffic manager
const traffic={

  tick(dt){

function closestObb(cx,cy,fx,fy,hl,hw,px,py){

// ---------------------------------------------------------------- player
const player={
  x:0,y:0,vx:0,vy:0,heading:0,speed:0,active:false,helmets:3,invuln:0,air:0,airT:0,bounce:0,slide:0,frozen:0,wob:0,wobV:0,lean:0,wallCd:0,blinkT:0,
  group:null,pivot:null,
  build(){
    const root=new T.Group(), ring=new GB();
    for(let i=0;i<16;i++){ const a0=i/16*Math.PI*2, a1=(i+1)/16*Math.PI*2; ring.beam(Math.cos(a0)*1.25,.05,Math.sin(a0)*1.25,Math.cos(a1)*1.25,.05,Math.sin(a1)*1.25,.16,0xffeb33); }
    root.add(ring.mesh(M_VC_GLOW));
    const pivot=new T.Group(); root.add(pivot);
    this.spr=sprite('ojol',2.1,0.38,0.6); pivot.add(this.spr);
    scene.add(root); this.group=root; this.pivot=pivot;
  },
  fwd(){ return [Math.sin(this.heading*DEG),Math.cos(this.heading*DEG)]; },
  get s01(){ return clamp(this.speed/CFG.maxSpeed,0,1); },
  reset(x,y,h){ Object.assign(this,{x,y,heading:h,speed:0,vx:0,vy:0,helmets:CFG.helmets,invuln:0,air:0,bounce:0,slide:0,frozen:0,wob:0,wobV:0,lean:0,active:true}); this.group.visible=true; this.visual(0,0); },
  park(){ this.active=false; this.speed=0; this.vx=this.vy=0; this.invuln=0; this.group.visible=true; },
  tick(dt){
    if(!this.active||dt<=0) return;
    if(this.wallCd>0) this.wallCd-=dt;
    if(this.invuln>0){ this.invuln-=dt; this.blinkT+=dt; this.group.visible=this.invuln<=0||(this.blinkT%0.16)<0.1; }
    const prevH=this.heading;
    if(this.frozen>0){ this.frozen-=dt; this.speed=0; this.vx=this.vy=0; this.visual(dt,0); return; }
    const surf=surfaceAt(this.x,this.y); let f=surf===SSIDE?CFG.sidewalkF:(surf===SGANG?CFG.gangF:1); if(hazards.inFlood) f*=CFG.floodF;
    let target=CFG.maxSpeed*f; if(input.hold) target*=CFG.holdFactor; if(input.brake) target=0;
    if(this.air>0){ this.air-=dt; if(this.air<=0){ this.air=0; this.wobV+=90; game.onLanded(this.x,this.y); } }
    else if(input.dx||input.dy){
      const diff=dAng(this.heading,headingOf(input.dx,input.dy)); let rate=lerp(CFG.turnLow,CFG.turnHigh,this.s01); if(this.slide>0) rate*=0.6;
      this.heading+=clamp(diff,-rate*dt,rate*dt); if(Math.abs(diff)>CFG.sharpTurn) target*=0.55;
    }
    this.heading=((this.heading%360)+360)%360;
    this.speed=mt(this.speed,target,(target>this.speed?CFG.accel:CFG.brake)*dt);
    let grip=CFG.grip*(rush.raining?CFG.rainGrip:1); if(this.slide>0){ this.slide-=dt; grip=CFG.puddleGrip; } if(this.air>0) grip=0.5;
    const [fx,fy]=this.fwd(), k=expl(grip,dt); this.vx=lerp(this.vx,fx*this.speed,k); this.vy=lerp(this.vy,fy*this.speed,k);
    this.move(dt);
    this.visual(dt,dAng(prevH,this.heading)/dt);
  },
  move(dt){
    const r=CFG.radius, nx=this.x+this.vx*dt, ny=this.y+this.vy*dt;
    if(drivable(nx,ny,r)||!drivable(this.x,this.y,r)){ this.x=nx; this.y=ny; return; }
    let into;
    if(Math.abs(this.vx)>=Math.abs(this.vy)&&drivable(nx,this.y,r)){ into=Math.abs(this.vy); this.x=nx; this.vy=0; }
    else if(drivable(this.x,ny,r)){ into=Math.abs(this.vx); this.y=ny; this.vx=0; }
    else if(drivable(nx,this.y,r)){ into=Math.abs(this.vy); this.x=nx; this.vy=0; }

    this.group.position.set(this.x,y,-this.y); this.group.rotation.y=-yaw*DEG; syncShadow(this.spr,-yaw*DEG);

  },
  startSlide(){ const fresh=this.slide<=0; this.slide=CFG.puddleSlide; if(fresh) this.wobV+=60; return fresh; },
  pothole(){ this.speed*=.72; this.wobV+=(Math.random()<.5?-1:1)*220; this.bounce=.2; },
  speedBump(){ if(this.speed>6){ this.airT=this.air=CFG.jump*(.5+.5*this.s01); game.onJump(this.x,this.y); } else { this.bounce=.2; this.speed*=.9; } },
  hardStop(dx,dy){ this.speed=0; this.vx=dx*2; this.vy=dy*2; this.wobV+=200; },
  freeze(t){ this.frozen=t; this.speed=0; this.vx=this.vy=0; },
  hit(nx,ny,ovx,ovy,heavy){
    if(heavy){ this.speed*=.15; this.vx=nx*6+ovx*.5; this.vy=ny*6+ovy*.5; this.wobV+=420*(Math.random()<.5?-1:1); this.invuln=CFG.invuln; this.blinkT=0; }
    else { const into=(this.vx-ovx)*nx+(this.vy-ovy)*ny; if(into<0){ this.vx-=nx*into*1.4; this.vy-=ny*into*1.4; } this.vx+=ovx*.3; this.vy+=ovy*.3; this.speed*=.65; this.wobV+=150*(Math.random()<.5?-1:1); }
  }
};

function buildMarker(col,bowl){
  const root=new T.Group(), g=new GB(); const rr=CFG.markerR;
  for(let i=0;i<20;i+=2){ const a0=i/20*Math.PI*2, a1=(i+1)/20*Math.PI*2; g.beam(Math.cos(a0)*rr,.2,Math.sin(a0)*rr,Math.cos(a1)*rr,.2,Math.sin(a1)*rr,.3,col); }
  g.box(0,6,0,.35,12,.35,col); root.add(g.mesh(M_VC_GLOW));
  const ic=new GB();
  if(bowl){ ic.bb(0,-.25,0,1.5,.5,1.5,0xffffff); ic.bb(0,.05,0,1.3,.12,1.3,0xf2bf4d); ic.beam(-.3,.3,0,.1,1.2,-.1,.07,0x996633); ic.beam(-.1,.3,0,.3,1.2,-.1,.07,0x996633); }
  else { ic.box(0,.1,0,1.2,.9,1,0xf2f2e6); ic.box(0,.95,0,1.5,.2,1.2,0xd94033); }
  const icon=ic.mesh(M_VC_GLOW); icon.position.y=3; root.add(icon); root.visible=false; scene.add(root);
  return {root,icon};
}
const orders={
  cur:null, next:.6, time:0, pick:null, drop:null,

  reset(){ this.cur=null; this.next=.6; this.pick.root.visible=false; this.drop.root.visible=false; },
  target(){ const o=this.cur; if(!o) return null; return o.stage==='pick'?o.pickup:o.dropoff; },
  spot(fx,fy,mn,mx,resto){ let first=null; for(let t=0;t<60;t++){ const s=pick(SPOTS); if(t<40&&s.resto!==resto) continue; const d=Math.hypot(s.x-fx,s.y-fy); if(d>=mn&&d<=mx) return s; if(!first) first=s; } return first; },
  place(m,s){ m.root.visible=true; m.root.position.set(s.x,SW_H,-s.y); },

    const route=Math.abs(player.x-pk.x)+Math.abs(player.y-pk.y)+Math.abs(pk.x-dp.x)+Math.abs(pk.y-dp.y);

    this.cur={food,pickup:pk,dropoff:dp,item:food?pick(FOODS):pick(PAKETS),total,left:total,stage:'pick',penalty:0};

const cam={
  fx:0,fy:0,ox:0,oy:0,half:12,shake:0,kick:0,t:0,frustum:new T.Frustum(),pm:new T.Matrix4(),sph:new T.Sphere(new T.Vector3(),1),
  snap(){ this.fx=player.x; this.fy=player.y+2; this.ox=this.oy=0; this.half=12; this.place(0); },
  update(dt,raw){
    this.t+=raw; const wx=clamp(player.vx*.75,-11,11), wy=clamp(player.vy*.75,-11,11);
    this.ox=lerp(this.ox,wx,expl(2.5,dt)); this.oy=lerp(this.oy,wy,expl(2.5,dt));
    this.fx=lerp(this.fx,player.x+this.ox,expl(8,dt)); this.fy=lerp(this.fy,player.y+this.oy+2,expl(8,dt));
    this.half=lerp(this.half,lerp(12,16,player.s01),expl(1.5,dt)); this.place(raw);
  },
  place(raw){
    const asp=Math.max(.3,camera.aspect), hf=2*Math.atan(Math.tan(camera.fov*DEG/2)*asp);
    let dist=clamp(this.half/Math.tan(hf/2),18,70); this.kick=mt(this.kick,0,raw*3); dist*=1-this.kick*.06;
    const p=58*DEG; let x=this.fx, y=Math.sin(p)*dist, z=-this.fy+Math.cos(p)*dist;

  if(input.mode==='joy'){ [input.ox,input.oy]=input.jc(); } else { input.ox=e.clientX; input.oy=e.clientY; }
  input.kx=e.clientX; input.ky=e.clientY; clampKnob(); e.preventDefault();

    const col=o.stage==='pick'?'#ff8a1f':'#1fc75a'; $('arrowPath').setAttribute('fill',col); $('arrowDist').style.color=col;
    ar.style.display='block';
    if(!behind&&sx>side&&sx<W-side&&sy>top&&sy<bottom){ const bob=Math.sin(performance.now()/160)*8; ar.style.transform=`translate(${sx}px,${sy-60+bob}px) rotate(180deg)`; $('arrowDist').textContent=''; }
    else { const cx=W/2, cy=(top+bottom)/2; let dx=sx-cx, dy=sy-cy; if(behind){ dx=-dx; dy=-dy; } if(Math.abs(dx)+Math.abs(dy)<1) dy=1;
      const k=Math.min((W/2-side)/Math.max(1e-3,Math.abs(dx)),((bottom-top)/2)/Math.max(1e-3,Math.abs(dy)));
      const ang=Math.atan2(dx,-dy)/DEG; ar.style.transform=`translate(${cx+dx*k}px,${cy+dy*k}px) rotate(${ang}deg)`;
      this.set('arrowDist',Math.round(Math.hypot(tg.x-player.x,tg.y-player.y))+' m'); $('arrowDist').style.transform=`translateX(-50%) rotate(${-ang}deg)`; }
  }
};

// ---------------------------------------------------------------- score / combo / rating
const score={score:0,deliveries:0,near:0,tips:0, reset(){ this.score=this.deliveries=this.near=this.tips=0; }};
const combo={count:0,best:0,timer:0,pulse:0,
  reg(){ this.count=this.timer>0?this.count+1:1; this.timer=CFG.comboWindow; this.best=Math.max(this.best,this.count); this.pulse=1; return this.mult(); },
  mult(){ return this.count<1?1:Math.min(this.count,CFG.maxMult); }, left(){ return this.count>0?this.timer/CFG.comboWindow:0; },
  tick(dt){ this.pulse=mt(this.pulse,0,dt*4); if(this.timer<=0) return; this.timer-=dt; if(this.timer<=0){ this.timer=0; this.count=0; } },
  brk(){ this.count=0; this.timer=0; }, reset(){ this.brk(); this.best=0; } };
const rating={h:[], reset(){ this.h=Array(CFG.ratingSeed).fill(5); }, rec(s){ this.h.push(clamp(s,1,5)); while(this.h.length>CFG.ratingHistory) this.h.shift(); }, avg(){ return this.h.length?this.h.reduce((a,b)=>a+b,0)/this.h.length:5; }};

// ---------------------------------------------------------------- game flow
const START=[2*PITCH-LANE*1.5, PITCH+14];
const game={
  state:'title', paused:false, hitStop:0, popCd:0, overT:0, best:+store.get('ojol_best',0)||0, newBest:false, reason:'',
  title(){ this.state='title'; player.reset(START[0]-CORR+1.2+LANE*1.5,START[1],180); player.park(); cam.snap(); rush.reset(); hazards.reset(rush.level); traffic.reset(rush.level); orders.reset(); this.screens(); },
  start(){
    audio.init(); this.state='play'; this.paused=false; this.hitStop=0; this.newBest=false;
    score.reset(); combo.reset(); rating.reset(); rush.reset(); player.reset(START[0],START[1],0); cam.snap();
    hazards.reset(rush.level); traffic.reset(rush.level); orders.reset(); fx.clear(); hud.clear(); hud.big('GAS!','Shift dimulai - antar semua order!');
    input.touching=false; this.screens();
  },
  over(reason){
    if(this.state!=='play') return; this.state='over'; this.reason=reason; this.overT=0; player.park();
    if(score.score>this.best){ this.best=score.score; this.newBest=true; store.set('ojol_best',String(this.best)); }
    audio.play('gameover'); this.screens();
  },
  togglePause(){ if(this.state!=='play') return; this.paused=!this.paused; input.touching=false; this.screens(); },
  screens(){
    $('title').hidden=this.state!=='title'; $('hud').hidden=this.state!=='play'; $('pause').hidden=!(this.state==='play'&&this.paused); $('over').hidden=this.state!=='over';
    $('bestTitle').textContent=this.best?'Skor terbaik: '+fmt(this.best):'Belum ada skor. Gas!';
    for(const b of document.querySelectorAll('.ctrlBtn')) b.textContent='Kontrol: '+(input.mode==='drag'?'SERET (bebas)':'JOYSTICK (tetap)');
    if(this.state==='over'){
      $('reason').textContent=this.reason; $('finalScore').textContent=fmt(score.score);
      $('bestOver').textContent=this.newBest?'REKOR BARU!':'Terbaik: '+fmt(this.best);
      $('stats').innerHTML=[['Antaran',score.deliveries],['Salip',score.near],['Combo terbaik','x'+combo.best],['Rating',rating.avg().toFixed(1)],['Tip',fmt(score.tips)],['Rush tertinggi',rush.idx+1]]
        .map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('');
      $('againBtn').disabled=true; setTimeout(()=>{$('againBtn').disabled=false;},600);
    }
  },
  contacts(){
    const r=CFG.radius;
    for(const v of traffic.list){
      const rx=player.x-v.px, ry=player.y-v.py, reach=v.hl+4; if(rx*rx+ry*ry>reach*reach){ v.armed=true; continue; }
      const c=closestObb(v.px,v.py,v.fx,v.fy,v.hl,v.hw,player.x,player.y), dx=player.x-c.x, dy=player.y-c.y, dist=Math.hypot(dx,dy);
      const vvx=v.fx*v.speed, vvy=v.fy*v.speed;
      if(c.inside||dist<r){
        let nx,ny; if(dist<1e-4){ const s=(-rx*v.fy+ry*v.fx)>=0?1:-1; nx=-v.fy*s; ny=v.fx*s; } else { nx=dx/dist; ny=dy/dist; if(c.inside){ nx=-nx; ny=-ny; } }
        player.x=c.x+nx*(r+.02); player.y=c.y+ny*(r+.02);
        const closing=(player.vx-vvx)*-nx+(player.vy-vvy)*-ny, heavy=closing>CFG.heavy&&player.invuln<=0;
        this.crash(heavy,nx,ny,vvx,vvy,c.x,c.y); v.bumped=1.2; v.speed*=.3; v.armed=false; if(v.honkCd<=0){ v.honkCd=2; audio.horn(v); }
        continue;
      }
      const gap=dist-r;
      if(gap>3) v.armed=true;
      else if(gap<CFG.nearDist&&v.armed&&player.speed>CFG.nearMinSpeed&&player.invuln<=0&&Math.hypot(player.vx-vvx,player.vy-vvy)>4){ v.armed=false; this.nearMiss(v); }
    }
  },
  nearMiss(v){
    const m=combo.reg(), pts=CFG.nearPts*m; score.score+=pts; score.near++;
    const col=m>=5?'#ff6ef0':m>1?'#ffd23f':'#fff17a';
    hud.popup(v.px,v.py,2.5,(m>1?'SALIP x'+m+'! +':'SALIP! +')+pts,col,.8+Math.min(m,8)*.06); hud.lines(); cam.kick=Math.max(cam.kick,.6); audio.play('whoosh',.9,.9+Math.min(m,10)*.05);
  },
  crash(heavy,nx,ny,ovx,ovy,x,y){
    combo.brk();
    if(heavy){
      player.helmets--; player.hit(nx,ny,ovx,ovy,true); this.hitStop=CFG.hitStop; cam.shake=Math.max(cam.shake,.7); hud.flash(true);
      fx.emit('spark',x,1,y,22); fx.emit('dust',x,1,y,10); audio.play('crash'); hud.popup(x,y,2,'BRAK!','#ff5a45',1.4);
      const sp=orders.heavyCrash(); if(sp){ hud.popup(player.x,player.y,3,sp,'#ffa04d',1); fx.emit('confetti',player.x,1.2,player.y,10); }
      if(player.helmets<=0) this.over('Helm hancur! Kebanyakan nabrak.');
    } else {
      player.hit(nx,ny,ovx,ovy,false); cam.shake=Math.max(cam.shake,.25); hud.flash(false); fx.emit('dust',x,1,y,5); audio.play('bump');
      if(this.popCd<=0){ this.popCd=.6; hud.popup(x,y,2,'DUK!','#ffdca0',.9); }
    }
  },
  hitObstacle(nx,ny,cx,cy,ovx,ovy,label){ player.x=cx+nx*(CFG.radius+.02); player.y=cy+ny*(CFG.radius+.02);
    const closing=player.vx*-nx+player.vy*-ny, heavy=closing>CFG.heavy&&player.invuln<=0; this.crash(heavy,nx,ny,0,0,cx,cy); if(heavy) hud.popup(cx,cy,3,label,'#ffb347',1); },
  critter(x,y,text,sound,kind,complaint){
    combo.brk(); fx.emit(kind,x,.5,y,kind==='feather'?16:8); audio.play(sound); hud.popup(x,y,1.5,text,'#ffe680',1); cam.shake=Math.max(cam.shake,.25);
    if(complaint){ orders.complaint(); hud.banner('Komplain warga! -1 bintang'); } else player.speed*=.7;
  },
  onPothole(x,y){ cam.shake=Math.max(cam.shake,.25); audio.play('bump',1,.8); fx.emit('dust',x,.2,y,6); if(this.popCd<=0){ this.popCd=.8; hud.popup(x,y,2,'JEGLONG!','#e6d6c2',.8); } },
  onJump(x,y){ audio.play('bump',.7,1.3); fx.emit('dust',x,.1,y,5); if(this.popCd<=0){ this.popCd=.8; hud.popup(x,y,2,'POLISI TIDUR!','#ffe14d',.75); } },
  onLanded(x,y){ cam.shake=Math.max(cam.shake,.2); audio.play('bump',.7,.9); fx.emit('dust',x,.1,y,8); },
  onWall(x,y){ combo.brk(); cam.shake=Math.max(cam.shake,.25); audio.play('bump'); fx.emit('dust',x,.5,y,6); if(this.popCd<=0){ this.popCd=.6; hud.popup(x,y,2,'DUK!','#ffdca0',.9); } },
  onRazia(x,y){ combo.brk(); orders.timePenalty(CFG.raziaPenalty); audio.play('siren'); cam.shake=Math.max(cam.shake,.3);
    hud.popup(x,y,1.5,'KENA RAZIA! -'+CFG.raziaPenalty+' dtk','#ff6a5a',1.2); hud.banner('"Selamat sore, SIM dan STNK-nya?"'); },
  delivered(o,stars){
    const pts=Math.round((CFG.deliveryBase+Math.max(0,o.left)*CFG.speedBonus)*(stars/3)), tip=CFG.tips[clamp(stars,0,5)];
    score.score+=pts+tip; score.tips+=tip; score.deliveries++; rating.rec(stars);
    fx.emit('confetti',o.dropoff.x,2,o.dropoff.y,40); audio.play('chaching');
    hud.popup(o.dropoff.x,o.dropoff.y,2,'PESANAN SAMPAI! +'+fmt(pts),'#4dff88',1.1);
    hud.screenPop(.5,.52,'★'.repeat(stars)+(stars===5?' MANTAP!':''),'#ffd23f',1.3); if(tip) hud.screenPop(.5,.58,'TIP +'+tip,'#b8ff9e',1);
    rush.deliveries(score.deliveries); this.checkRating();
  },
  orderFailed(){ rating.rec(1); audio.play('bump',1,.6); hud.screenPop(.5,.5,'ORDER DIBATALKAN - ★1','#ff6a5a',1.1); hud.banner('Customer kecewa... rating turun'); this.checkRating(); },
  checkRating(){ if(rating.avg()<CFG.ratingOver) this.over('Rating anjlok - akun dibekukan!'); }
};

$('startBtn').onclick=()=>game.start();
$('againBtn').onclick=()=>game.start();
$('restartBtn').onclick=()=>game.start();
$('resumeBtn').onclick=()=>game.togglePause();
$('pauseBtn').onclick=()=>game.togglePause();
for(const b of document.querySelectorAll('.ctrlBtn')) b.onclick=()=>{ input.mode=input.mode==='drag'?'joy':'drag'; store.set('ojol_ctrl',input.mode); game.screens(); };
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&game.state==='play'&&!game.paused) game.togglePause(); });

// ---------------------------------------------------------------- boot & loop
function resize(){ const w=gameEl.clientWidth||innerWidth, h=gameEl.clientHeight||innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize);
let last=performance.now();
{ const sb=$('startBtn'), label=sb.textContent; sb.disabled=true; sb.textContent='MEMUAT 3D…';
  loadModels((d,n)=>{ sb.textContent='MEMUAT 3D '+d+'/'+n; }).then(()=>{
    buildCity(); buildSignals(); player.build(); orders.init(); fx.init(); hud.init(); rating.reset(); resize(); game.title();
    sb.disabled=false; sb.textContent=label; last=performance.now(); requestAnimationFrame(frame);
  }); }
function frame(now){
  const raw=Math.min(.1,(now-last)/1000); last=now; let dt=Math.min(raw,.05);
  if(game.hitStop>0){ game.hitStop-=raw; dt=0; } if(game.popCd>0) game.popCd-=raw; if(game.paused) dt=0;
  input.update();
  if(game.state==='play'){ player.tick(dt); traffic.tick(dt); hazards.tick(dt); hazards.checkPlayer(dt); if(dt>0) game.contacts(); combo.tick(dt); orders.tick(dt); rush.tick(dt); }
  else { if(game.state==='over') game.overT+=raw; traffic.tick(dt); hazards.tick(dt); orders.tick(dt); rush.tick(dt); }
  cam.update(dt,raw); fx.tick(dt); audio.tick(raw); hud.tick(game.paused?0:raw);
  renderer.render(scene,camera); requestAnimationFrame(frame);
}
</script>
